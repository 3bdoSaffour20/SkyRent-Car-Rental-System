{% extends "base.html" %}

{% block title %}Server error — SkyRent{% endblock %}

{% block content %}
<div class="container page-centered">
  <div class="card p-4 p-md-5 text-center">
    <div class="auth-icon auth-icon-lg">
      <i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
    </div>
    <div class="section-kicker">Error 500</div>
    <h1 class="h2 mt-2">Something went wrong</h1>
    <p class="text-dim mx-auto measure-46">
      Our server hit a bump in the road. Please try again in a moment —
      if it keeps happening, contact support.
    </p>
    <div class="d-flex justify-content-center gap-3 flex-wrap mt-4">
      <a href="{% url 'cars:home' %}" class="btn btn-accent px-4"><i class="bi bi-house me-1"></i>Back home</a>
      <a href="{% url 'cars:list' %}" class="btn btn-outline-accent px-4"><i class="bi bi-car-front me-1"></i>Browse cars</a>
    </div>
  </div>
</div>
{% endblock %}
